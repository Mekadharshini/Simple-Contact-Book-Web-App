```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
        }

        .delete-box {
            width: 380px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .delete-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #2d3436;
            margin-bottom: 15px;
        }

        p {
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .cancel-btn {
            background: #dfe6e9;
            color: #2d3436;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .cancel-btn:hover {
            background: #b2bec3;
        }
    </style>
</head>

<body>

    <div class="delete-box">
        <div class="delete-icon">🗑️</div>

        <h2>Delete Contact</h2>

        <p>
            Are you sure you want to delete this contact?
            This action cannot be undone.
        </p>

        <button class="btn delete-btn" onclick="deleteContact()">
            Yes, Delete
        </button>

        <a href="view.html" class="btn cancel-btn">
            Cancel
        </a>
    </div>

    <script>
        function deleteContact() {
            alert("Contact deleted successfully!");
            window.location.href = "view.html";
        }
    </script>

</body>
</html>
```
