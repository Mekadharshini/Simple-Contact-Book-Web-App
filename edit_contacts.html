
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d7e3fc, #f0f4ff);
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 95%;
            max-width: 430px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 5px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px #9ac5ff;
        }

        .update-btn {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #0056b3;
        }

        .back-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
            padding: 11px;
            border: 1px solid #007bff;
            border-radius: 10px;
            color: #007bff;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #f0f6ff;
        }

        .photo-preview {
            display: none;
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%;
            margin: 12px auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h2>✏️ Edit Contact</h2>

            <form id="editForm">

                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                       value="Arun Kumar" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       value="+91 9876543210" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       value="arun@gmail.com" required>

                <label for="group">Group</label>
                <select id="group" name="group" required>
                    <option value="">Select Group</option>
                    <option value="Family">Family</option>
                    <option value="Friends" selected>Friends</option>
                    <option value="Work">Work</option>
                    <option value="School">School</option>
                    <option value="College">College</option>
                    <option value="Others">Others</option>
                </select>

                <label for="tag">Tag</label>
                <input type="text" id="tag" name="tag"
                       value="Developer" required>

                <label for="photo">Contact Photo (Optional)</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*">

                <img id="preview" class="photo-preview"
                     alt="Contact photo preview">

                <button type="submit" class="update-btn">
                    Update Contact
                </button>

                <a href="view.html" class="back-btn">
                    ⬅ Back to View Contacts
                </a>

            </form>

        </div>
    </div>

    <script>
        const form = document.getElementById("editForm");
        const photo = document.getElementById("photo");
        const preview = document.getElementById("preview");

        photo.addEventListener("change", function () {
            if (this.files && this.files[0]) {
                preview.src = URL.createObjectURL(this.files[0]);
                preview.style.display = "block";
            }
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            alert("Contact details updated successfully!");
        });
    </script>

</body>
</html>
