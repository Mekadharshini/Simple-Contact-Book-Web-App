
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d7e3fc, #f0f4ff);
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 95%;
            max-width: 430px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 5px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px #9ac5ff;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        .home-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
            padding: 11px;
            border: 1px solid #007bff;
            border-radius: 10px;
            color: #007bff;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #f0f6ff;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h2>➕ Add Contact</h2>

            <form action="#" method="post">

                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="+91XXXXXXXXXX" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter email" required>

                <label for="group">Group</label>
                <select id="group" name="group" required>
                    <option value="">Select Group</option>
                    <option value="Family">Family</option>
                    <option value="Friends">Friends</option>
                    <option value="Work">Work</option>
                    <option value="School">School</option>
                    <option value="College">College</option>
                    <option value="Others">Others</option>
                </select>

                <label for="tag">Tag</label>
                <input type="text" id="tag" name="tag"
                       placeholder="Doctor, Client, Manager" required>

                <label for="photo">Contact Photo (Optional)</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*">

                <button type="submit" class="save-btn">
                    Save Contact
                </button>

                <a href="home.html" class="home-btn">
                    ⬅ Back to Home
                </a>

            </form>

        </div>
    </div>

</body>
</html>
