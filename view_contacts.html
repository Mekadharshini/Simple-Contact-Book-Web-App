
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Contacts | Contact Book</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d7e3fc, #f0f4ff);
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(135deg, #004aad, #007bff);
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 21px;
            font-weight: bold;
        }

        .btn-home {
            background: white;
            color: #007bff;
            padding: 9px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .search-bar {
            width: 90%;
            max-width: 650px;
            margin: 30px auto;
        }

        .search-bar input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .contact-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 0 20px 100px;
        }

        .contact-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            padding: 22px;
            width: 100%;
            max-width: 600px;
            transition: 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.13);
        }

        .contact-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00b4d8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        .contact-card h3 {
            margin-bottom: 6px;
            color: #222;
        }

        .contact-email {
            color: #6c757d;
            font-size: 14px;
        }

        .contact-number {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            color: #333;
        }

        .badges {
            margin-top: 14px;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            margin-right: 5px;
        }

        .group {
            background: #007bff;
        }

        .tag {
            background: #6c757d;
        }

        .contact-actions {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            text-decoration: none;
            padding: 8px 13px;
            border-radius: 7px;
            font-size: 14px;
        }

        .edit-btn {
            color: #0d6efd;
            background: #eaf2ff;
        }

        .delete-btn {
            color: #dc3545;
            background: #fff0f1;
        }

        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            font-size: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00b4d8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
            text-decoration: none;
        }

        .empty-message {
            text-align: center;
            color: #666;
            margin-top: 30px;
        }

        @media (max-width: 500px) {
            nav {
                padding: 15px;
            }

            .nav-title {
                font-size: 17px;
            }

            .contact-grid {
                padding: 0 12px 100px;
            }

            .contact-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <span class="nav-title">📇 My Contact Book</span>
        <a href="home.html" class="btn-home">🏠 Home</a>
    </nav>

    <div class="search-bar">
        <input type="text" id="searchInput"
               placeholder="🔍 Search by name, number or email...">
    </div>

    <div class="contact-grid" id="contactResults">

        <div class="contact-card">
            <div class="contact-header">
                <div class="avatar">A</div>
                <div>
                    <h3>Arun Kumar</h3>
                    <p class="contact-email">arun@gmail.com</p>
                </div>
            </div>

            <div class="contact-number">📞 +91 9876543210</div>

            <div class="badges">
                <span class="badge group">🗂 Friends</span>
                <span class="badge tag">🏷 Developer</span>
            </div>

            <div class="contact-actions">
                <a href="update.html" class="edit-btn">✏️ Edit</a>
                <a href="#" class="delete-btn"
                   onclick="return confirm('Delete this contact?')">
                    🗑 Delete
                </a>
            </div>
        </div>

        <div class="contact-card">
            <div class="contact-header">
                <div class="avatar">P</div>
                <div>
                    <h3>Priya Sharma</h3>
                    <p class="contact-email">priya@gmail.com</p>
                </div>
            </div>

            <div class="contact-number">📞 +91 9123456780</div>

            <div class="badges">
                <span class="badge group">🗂 Family</span>
                <span class="badge tag">🏷 Student</span>
            </div>

            <div class="contact-actions">
                <a href="update.html" class="edit-btn">✏️ Edit</a>
                <a href="#" class="delete-btn"
                   onclick="return confirm('Delete this contact?')">
                    🗑 Delete
                </a>
            </div>
        </div>

        <div class="contact-card">
            <div class="contact-header">
                <div class="avatar">R</div>
                <div>
                    <h3>Rahul Raj</h3>
                    <p class="contact-email">rahul@gmail.com</p>
                </div>
            </div>

            <div class="contact-number">📞 +91 9988776655</div>

            <div class="badges">
                <span class="badge group">🗂 Work</span>
                <span class="badge tag">🏷 Manager</span>
            </div>

            <div class="contact-actions">
                <a href="update.html" class="edit-btn">✏️ Edit</a>
                <a href="#" class="delete-btn"
                   onclick="return confirm('Delete this contact?')">
                    🗑 Delete
                </a>
            </div>
        </div>

    </div>

    <a href="add.html" class="fab" title="Add Contact">+</a>

    <script>
        const searchInput = document.getElementById("searchInput");
        const cards = document.querySelectorAll(".contact-card");

        searchInput.addEventListener("input", function () {
            const query = this.value.toLowerCase();

            cards.forEach(function (card) {
                const text = card.innerText.toLowerCase();

                card.style.display =
                    text.includes(query) ? "block" : "none";
            });
        });
    </script>

</body>
</html>
